<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢结构日常工作平台</title>
<style>
:root{
  --nav:#152a45; --nav2:#1d3a5f; --brand:#1f5fae; --brand2:#2f78d0; --accent:#e07b32;
  --bg:#f3f6fa; --card:#ffffff; --line:#e2e8f0; --line2:#eef2f7;
  --txt:#1c2b3e; --sub:#6b7c91; --mute:#94a3b8;
  --ok:#138a62; --warn:#d98218; --bad:#c8443c; --soft:#eaf2fc;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}
a{color:var(--brand2);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c3ceda;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.side{width:228px;flex:none;background:var(--nav);color:#cdd9e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .logo{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.side .logo b{display:block;color:#fff;font-size:17px;letter-spacing:.5px;line-height:1.35}
.side .logo span{display:block;font-size:11.5px;color:#8fa7c2;margin-top:5px;letter-spacing:1.2px}
.side .grp{padding:16px 14px 4px;font-size:11px;color:#6f89a8;letter-spacing:1.5px}
.nav{padding:0 10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#b9cbe0;font-size:13.5px;margin-bottom:3px;cursor:pointer;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff;text-decoration:none}
.nav a.on{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(31,95,174,.4)}
.nav a .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
.side .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#7e96b2;line-height:1.7}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:62px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:20}
.top .crumb{font-size:13px;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .crumb b{color:var(--txt);font-size:15px}
.top .today{font-size:12.5px;color:var(--sub);white-space:nowrap}
.top .saved{font-size:11.5px;color:var(--ok);background:#e9f7f1;border:1px solid #c9ebdd;border-radius:20px;padding:3px 10px;white-space:nowrap}
.wrap{padding:24px 26px 60px;max-width:1500px;width:100%}

h1{font-size:22px;margin:0 0 6px;letter-spacing:.3px}
h2{font-size:17px;margin:0 0 14px}
h3{font-size:15px;margin:0 0 10px}
.lead{color:var(--sub);font-size:13px;margin:0 0 20px}
.sec{margin-bottom:24px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-hd h2,.sec-hd h3{margin:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:0 1px 2px rgba(20,40,70,.03)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1180px){.g5,.g4{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}.side{width:64px}.side .logo span,.side .grp,.nav a span:not(.ic),.side .foot{display:none}.nav a{justify-content:center}.wrap{padding:18px 14px 50px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;white-space:nowrap;transition:.15s;font-size:13px}
.btn:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.ghost{background:#fff;color:var(--brand);border-color:#cbd9ea}
.btn.ghost:hover{background:var(--soft)}
.btn.gray{background:#fff;color:var(--sub);border-color:var(--line)}
.btn.gray:hover{background:#f7f9fc}
.btn.warn{background:#fff;color:var(--accent);border-color:#f0c9a3}
.btn.danger{background:#fff;color:var(--bad);border-color:#ecc9c6}
.btn.danger:hover{background:#fdf0ef}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn.link{border:0;background:none;color:var(--brand2);padding:2px 4px}
.btn.link:hover{text-decoration:underline;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--sub)}
label.f b{font-weight:500;color:var(--txt)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 10px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,120,208,.12)}
textarea{resize:vertical;min-height:70px}
input[type=file]{padding:6px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.form-grid .wide{grid-column:span 2}
.hint{font-size:11.5px;color:var(--mute)}

.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand2)}
.kpi .k{font-size:12px;color:var(--sub)}
.kpi .v{font-size:25px;font-weight:650;letter-spacing:.5px;margin-top:6px;line-height:1.2}
.kpi .v small{font-size:12px;font-weight:400;color:var(--sub);margin-left:4px}
.kpi .d{font-size:11.5px;color:var(--mute);margin-top:4px}
.kpi.o:before{background:var(--accent)} .kpi.g:before{background:var(--ok)} .kpi.r:before{background:var(--bad)}

.folder{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:.18s;position:relative;min-height:112px}
.folder:hover{border-color:var(--brand2);transform:translateY(-2px);box-shadow:0 8px 22px rgba(25,60,110,.10)}
.folder .fi{width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px}
.folder .fn{font-size:14px;font-weight:600}
.folder .fv{font-size:22px;font-weight:650;color:var(--brand);margin-top:6px;line-height:1.1}
.folder .fv small{font-size:12px;color:var(--sub);font-weight:400;margin-left:3px}
.folder .fd{font-size:11px;color:var(--mute);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder.acc .fi{background:#fdf0e4;color:var(--accent)} .folder.acc .fv{color:var(--accent)}
.folder.clk{border-style:dashed;background:#fbfcfe;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;min-height:112px}
.folder.clk:hover{color:var(--brand)}

.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
th{background:#f7f9fc;color:var(--sub);font-weight:600;font-size:12px;position:sticky;top:0;z-index:2}
tbody tr:hover{background:#fafcff}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wide-cell{white-space:normal;min-width:180px;max-width:340px}
.empty{text-align:center;color:var(--mute);padding:28px 14px;font-size:13px}
.empty b{display:block;color:var(--sub);font-size:14px;margin-bottom:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid var(--line);background:#f7f9fc;color:var(--sub)}
.tag.ok{background:#e9f7f1;border-color:#c9ebdd;color:var(--ok)}
.tag.warn{background:#fdf3e3;border-color:#f3d9ae;color:var(--warn)}
.tag.bad{background:#fdeeed;border-color:#f2cdca;color:var(--bad)}
.tag.blue{background:var(--soft);border-color:#cfe0f5;color:var(--brand)}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:#eef2f7;border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.pathbar{display:flex;align-items:center;gap:10px;background:#f7f9fc;border:1px dashed #cfdbea;border-radius:8px;padding:9px 12px;font-size:12px;color:var(--sub);flex-wrap:wrap;margin-bottom:14px}
.pathbar code{background:#fff;border:1px solid var(--line);border-radius:5px;padding:3px 8px;color:var(--brand);font-family:Consolas,Monaco,monospace;font-size:12px}

.refcard{border-left:3px solid var(--brand2)}
.refcard .rt{font-size:14px;font-weight:600;margin-bottom:6px}
.refcard .rd{font-size:12.5px;color:var(--sub);line-height:1.75}
.refcard .rl{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.note{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--sub);line-height:1.85}
.note b{color:var(--txt)}
.note.orange{background:#fef8f1;border-color:#f3ddc2}

.gantt-shell{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.gantt-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfcfe}
.gantt-scroll{overflow:auto;max-height:560px}
.gantt-scroll svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);padding:9px 12px;border-top:1px solid var(--line);background:#fbfcfe}
.legend i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.sched-tbl input,.sched-tbl select{border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:5px;min-width:88px;font-size:12.5px}
.sched-tbl input:hover,.sched-tbl select:hover{border-color:var(--line);background:#fff}
.sched-tbl input:focus,.sched-tbl select:focus{border-color:var(--brand2);background:#fff}
.sched-tbl td{padding:4px 6px}
.sched-tbl th{padding:8px 8px}
.sched-tbl input[type=date]{min-width:132px}
.sched-tbl input[type=number]{min-width:64px;text-align:right}

.stat-strip{display:flex;gap:26px;flex-wrap:wrap;background:linear-gradient(100deg,#f0f6ff,#fbfdff);border:1px solid #d8e6f8;border-radius:9px;padding:14px 18px;margin-top:14px}
.stat-strip .s .k{font-size:11.5px;color:var(--sub)}
.stat-strip .s .v{font-size:21px;font-weight:650;color:var(--brand);margin-top:3px}
.stat-strip .s .v small{font-size:12px;color:var(--sub);font-weight:400}
.stat-strip .s.o .v{color:var(--accent)}

.modal-bg{position:fixed;inset:0;background:rgba(12,25,45,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:12px;width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1c2b3e;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;bottom:34px}
.mini{font-size:11.5px;color:var(--mute)}
.divider{height:1px;background:var(--line);margin:16px 0}
ul.tips{margin:0;padding-left:18px;font-size:12.5px;color:var(--sub);line-height:1.9}
ul.tips b{color:var(--txt)}
.summary-line{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px;font-size:13px;line-height:1.9;color:var(--txt)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><b>钢结构日常工作平台</b><span>STEEL WORK DESK</span></div>
    <div class="nav" id="nav"></div>
    <div class="foot">数据仅保存在本机浏览器<br>建议定期导出备份</div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="crumb" id="crumb"></div>
      <div class="today" id="today"></div>
      <div class="saved" id="saved">已保存</div>
      <button class="btn ghost sm" data-act="backup">导出备份</button>
    </div>
    <div class="wrap" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
/* ==================== 常量与数据 ==================== */
var KEY='steel_workdesk_v1';
var CATS=[
 {k:'shenhua', n:'深化设计审核', u:'条', i:'▤', d:'深化图纸、节点、模型审核'},
 {k:'fangan',  n:'施工方案审核', u:'条', i:'▦', d:'施组、专项方案、危大方案审核'},
 {k:'zhaocai', n:'招采审核',     u:'条', i:'▣', d:'招标文件、清单、合同技术条款审核'},
 {k:'yingxiao',n:'配合营销',     u:'条', i:'◇', d:'投标配合、技术交流、答疑'},
 {k:'zhuanti', n:'专题论证会',   u:'次', i:'◎', d:'专家论证、专题会、评审会'},
 {k:'zhuchang',n:'驻场配合',     u:'天', i:'⌂', d:'现场驻场、厂内监造配合'},
 {k:'qita',    n:'其他',         u:'条', i:'⋯', d:'未归类事项'}
];
var BOARDS=[
 {k:'zhaocai',  n:'招采配合',                 f:'招采配合',     i:'▣', u:'条'},
 {k:'shenhua',  n:'深化设计 / 深化设计管理', f:'深化设计管理', i:'▤', u:'条'},
 {k:'schedule', n:'进度管理',                 f:'进度管理',     i:'▦', u:'项', sp:'schedule'},
 {k:'quality',  n:'质量管理',                 f:'质量管理',     i:'◈', u:'条', ref:'inspect'},
 {k:'benefit',  n:'创效管理',                 f:'创效管理',     i:'◆', u:'条', sp:'benefit'}
];
var STAGES=['深化设计','原材料到厂','加工制作','运输进场','安装吊装','焊接高栓','涂装验收','其他'];
var REFS={
 progress:{n:'钢结构工程进度管理',lib:'https://www.workbuddy.cn/space/d/cdHuOCKYnCxzTxG0SDxk8A',app:'https://steel-progress-80046.app.workbuddy.host',d:'分级预警、分层进度、构件台账；实际进度统一通过「数据管理 → Excel 统一导入」更新。本工作台进度表字段与其导入模板一致，导入后甘特图自动重绘。'},
 inspect:{n:'钢结构现场巡查平台',lib:'https://www.workbuddy.cn/space/d/eDVqJ5civGfTNPnmCAQqxz',app:'https://steel-inspection.app.workbuddy.host/?sharecode=7E4DZMZRWX&shareId=6c4b975d598e43e4b72810bbef924235',d:'上传现场照片自动识别质量与安全隐患，匹配 GB 50205-2020 条款，一键生成整改通知单。本工作台「质量管理」板块收集巡查记录与整改闭环。'},
 total:{n:'钢结构施工管理总平台',lib:'https://www.workbuddy.cn/space/d/amjgpbGE3bILkz5EPhPaTw',app:'https://steel-mgmt-platform.app.workbuddy.host/?sharecode=T4BAOO2BBP',d:'吊装选型计算、工程进度、现场管理、试验检测、现场巡查五个工具的统一入口。'}
};
var NAV=[
 {g:'日常工作'},
 {k:'overview',n:'总览',i:'⌂'},
 {k:'internal',n:'内业工作',i:'▤'},
 {k:'summary', n:'周期汇总',i:'▦'},
 {g:'项目管理'},
 {k:'projects',n:'项目工作台',i:'▣'},
 {k:'refs',    n:'资料库引用',i:'◇'},
 {g:'系统'},
 {k:'data',    n:'数据管理',i:'⚙'},
 {k:'help',    n:'使用说明',i:'?'}
];

function seed(){return {v:1,internal:[],projects:[]};}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.internal&&d.projects)return d;}catch(e){}return seed();}
var DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));flashSaved();}catch(e){toast('保存失败：'+e.message);}}
function flashSaved(){var el=document.getElementById('saved');if(!el)return;el.textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});el.style.background='#e9f7f1';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2100);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtMoney(n){var v=Number(n)||0;return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function attr(s){return esc(s).replace(/\n/g,' ');}

var S={view:'overview',cat:null,pid:null,board:null,period:'week',pkey:null,dayW:14,search:'',impMode:'append'};

/* ==================== 日期与周期 ==================== */
function parseD(s){if(!s)return null;var d=new Date(String(s).slice(0,10)+'T00:00:00');return isNaN(d.getTime())?null:d;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function diffDays(a,b){return Math.round((b-a)/86400000);}
function weekStart(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);var w=x.getDay()||7;x.setDate(x.getDate()-w+1);return x;}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var wd=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-wd);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return {y:t.getUTCFullYear(),w:Math.ceil(((t-y0)/86400000+1)/7)};}
var PN={week:'周',month:'月',quarter:'季度',half:'半年',year:'年'};
function periodInfo(dateStr,type){
  var d=parseD(dateStr);if(!d)return null;
  var y=d.getFullYear(),m=d.getMonth()+1;
  if(type==='week'){var w=isoWeek(d),s=weekStart(d),e=addDays(s,6);return {key:w.y+'-W'+String(w.w).padStart(2,'0'),label:w.y+'年第'+w.w+'周',sub:iso(s)+' ~ '+iso(e),order:iso(s)};}
  if(type==='month')return {key:y+'-'+String(m).padStart(2,'0'),label:y+'年'+m+'月',sub:'',order:y+'-'+String(m).padStart(2,'0')};
  if(type==='quarter'){var q=Math.ceil(m/3);return {key:y+'-Q'+q,label:y+'年第'+q+'季度',sub:(q*3-2)+'月 ~ '+q*3+'月',order:y+'-Q'+q};}
  if(type==='half'){var h=m<=6?1:2;return {key:y+'-H'+h,label:y+'年'+(h===1?'上':'下')+'半年',sub:h===1?'1月 ~ 6月':'7月 ~ 12月',order:y+'-H'+h};}
  return {key:String(y),label:y+'年度',sub:'全年',order:String(y)};
}
function currentPeriod(type){var p=periodInfo(today(),type);return p?p.key:null;}
function summarize(type){
  var map={};
  DB.internal.forEach(function(r){
    var p=periodInfo(r.date,type);if(!p)return;
    if(!map[p.key])map[p.key]={key:p.key,label:p.label,sub:p.sub,order:p.order,vals:{},total:0};
    var q=Number(r.qty)||0;
    map[p.key].vals[r.cat]=(map[p.key].vals[r.cat]||0)+q;
    map[p.key].total+=q;
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.order.localeCompare(b.order);});
}
function catOf(k){for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return CATS[i];return CATS[6];}

function boardData(p,k){if(!p.boards)p.boards={};if(!p.boards[k])p.boards[k]=[];return p.boards[k];}

function folderPath(p,board){return '项目管理/'+(p?p.name:'项目名称')+'/'+(board?board.f:'');}

      '<td>'+inp('planStart',r.planStart,'date')+'</td><td>'+inp('planEnd',r.planEnd,'date')+'</td>'+
      '<td>'+inp('actStart',r.actStart,'date')+'</td><td>'+inp('actEnd',r.actEnd,'date')+'</td>'+
      '<td>'+inp('progress',r.progress,'number','style="min-width:64px;text-align:right" min="0" max="100"')+'</td>'+
      '<td>'+inp('owner',r.owner,'text','style="min-width:80px"')+'</td>'+
      '<td>'+inp('note',r.note,'text','style="min-width:110px"')+'</td>'+
      '<td><button class="btn link sm" data-act="del-sched" data-id="'+r.id+'">删</button></td></tr>';
  }).join('');

function ganttSVG(){
  var p=proj();if(!p)return '';var rows=scheduleOf(p);
  if(!rows.length)return '<div class="empty"><b>暂无可绘制的进度任务</b>在上方进度计划表新增任务，或导入进度 CSV 后即可生成甘特图</div>';
  var dates=[];
  rows.forEach(function(r){['planStart','planEnd','actStart','actEnd'].forEach(function(f){var d=parseD(r[f]);if(d)dates.push(d);});});
  if(!dates.length)return '<div class="empty"><b>尚未填写日期</b>请在进度计划表中填写计划开始 / 计划完成日期</div>';
  var min=new Date(Math.min.apply(null,dates)),max=new Date(Math.max.apply(null,dates));
  min=addDays(weekStart(min),0);max=addDays(max,7);
  var total=diffDays(min,max);if(total<14)total=14;max=addDays(min,total);
  var dayW=S.dayW,left=250,top=52,rowH=36,w=left+total*dayW+30,h=top+rows.length*rowH+34;
  var X=function(d){return left+diffDays(min,parseD(d))*dayW;};
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" font-family="Microsoft YaHei,PingFang SC,sans-serif" id="gantt-svg">';
  s+='<rect width="'+w+'" height="'+h+'" fill="#ffffff"/>';
  /* 表头背景 */
  s+='<rect x="0" y="0" width="'+w+'" height="'+top+'" fill="#f7f9fc"/>';
  s+='<line x1="0" y1="'+top+'" x2="'+w+'" y2="'+top+'" stroke="#e2e8f0"/>';
  /* 月份分组 */
  var months=[];var cur=new Date(min.getFullYear(),min.getMonth(),1);
  while(cur<=max){var ms=cur<min?min:new Date(cur);var nx=new Date(cur.getFullYear(),cur.getMonth()+1,1);var me=nx>max?max:addDays(nx,-1);
    months.push({s:ms,e:me,label:cur.getFullYear()+'年'+(cur.getMonth()+1)+'月'});cur=nx;}
  months.forEach(function(m){var x1=X(iso(m.s)),x2=X(iso(m.e))+dayW;
    s+='<rect x="'+x1+'" y="0" width="'+(x2-x1)+'" height="26" fill="#eef4fc" stroke="#dce7f5"/>';
    s+='<text x="'+(x1+8)+'" y="18" font-size="11.5" fill="#3f5b7d">'+esc(m.label)+'</text>';});
  /* 周刻度 */
  for(var i=0;i<=total;i+=7){var d=addDays(min,i),x=left+i*dayW;
    s+='<line x1="'+x+'" y1="26" x2="'+x+'" y2="'+h+'" stroke="#eef2f7"/>';
    if(dayW>=8)s+='<text x="'+(x+3)+'" y="43" font-size="10" fill="#8a9bb0">'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'</text>';}
  /* 左侧列头 */
  s+='<rect x="0" y="0" width="'+left+'" height="'+top+'" fill="#f7f9fc"/>';
  s+='<text x="12" y="34" font-size="12" fill="#6b7c91" font-weight="600">任务 / 构件 · 阶段</text>';
  s+='<line x1="'+left+'" y1="0" x2="'+left+'" y2="'+h+'" stroke="#dfe6ef"/>';
  /* 今日线 */
  var td=new Date();td=new Date(td.getFullYear(),td.getMonth(),td.getDate());
  if(td>=min&&td<=max){var tx=X(iso(td));s+='<line x1="'+tx+'" y1="26" x2="'+tx+'" y2="'+(h-24)+'" stroke="#c8443c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(tx+4)+'" y="'+(top-6)+'" font-size="10" fill="#c8443c">今日</text>';}
  /* 任务行 */
  rows.forEach(function(r,idx){
    var y=top+idx*rowH;
    if(idx%2===1)s+='<rect x="0" y="'+y+'" width="'+w+'" height="'+rowH+'" fill="#fafcff"/>';
    s+='<line x1="0" y1="'+(y+rowH)+'" x2="'+w+'" y2="'+(y+rowH)+'" stroke="#f0f3f8"/>';
    s+='<text x="12" y="'+(y+16)+'" font-size="12" fill="#1c2b3e">'+esc((r.name||'未命名').slice(0,18))+'</text>';
    s+='<text x="12" y="'+(y+30)+'" font-size="10" fill="#94a3b8">'+esc(((r.building||'')+(r.floor?' / '+r.floor:'')+' · '+(r.stage||'')).slice(0,26))+'</text>';
    var ps=parseD(r.planStart),pe=parseD(r.planEnd),as=parseD(r.actStart),ae=parseD(r.actEnd);
    var late=ae&&pe&&ae>pe;
    if(ps&&pe&&pe>=ps){
      var x1=X(r.planStart),bw=Math.max(dayW,(diffDays(ps,pe)+1)*dayW),by=y+8,bh=13;
      s+='<rect x="'+x1+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+(late?'#f3c9c6':'#b9d3f2')+'"/>';
      var pr=Math.max(0,Math.min(100,Number(r.progress)||0));
      if(pr>0)s+='<rect x="'+x1+'" y="'+by+'" width="'+(bw*pr/100)+'" height="'+bh+'" rx="3" fill="#2f78d0"/>';
      if(bw>46)s+='<text x="'+(x1+5)+'" y="'+(by+10)+'" font-size="9.5" fill="#ffffff">'+pr+'%</text>';
    }
    if(as&&ae&&ae>=as){
      var ax=X(r.actStart),aw=Math.max(dayW,(diffDays(as,ae)+1)*dayW);
      s+='<rect x="'+ax+'" y="'+(y+23)+'" width="'+aw+'" height="6" rx="2" fill="#e9a05c"/>';
    }
    if(late){
      var dd=diffDays(pe,ae);
      s+='<text x="'+(X(r.planEnd)+dayW+6)+'" y="'+(y+17)+'" font-size="10" fill="#c8443c">滞后 '+dd+' 天</text>';
    }
  });
  s+='<text x="12" y="'+(h-8)+'" font-size="10" fill="#94a3b8">'+esc(p.name)+' · 进度甘特图 · 生成于 '+today()+'</text>';
  s+='</svg>';
  return s;
}

function download(name,text,mime){var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},300);}
function csv(rows){return '\ufeff'+rows.map(function(r){return r.map(function(c){var s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\r\n');}
function parseCSV(text){
  text=text.replace(/^\ufeff/,'').trim();if(!text)return [];
  var lines=[],cur=[],val='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){val+='"';i++;}else q=false;}else val+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){cur.push(val);val='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;cur.push(val);lines.push(cur);cur=[];val='';}
    else val+=ch;}
  if(val||cur.length){cur.push(val);lines.push(cur);}
  return lines.filter(function(l){return l.some(function(c){return String(c).trim();});});
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast('已复制');},function(){fallback();});}
  else fallback();
  function fallback(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败，请手动选择');}ta.remove();}
}
var COLMAP={
 name:['任务名称','任务/构件名称','任务','构件编号','构件号','楼层','名称','事项'],
 building:['单体','楼栋','单体名称'],floor:['楼层'],
 stage:['阶段','工序','类型','阶段名称'],
 planStart:['计划开始','计划开始日期','计划开工','计划起始','原材料到厂日期','原材料到厂','计划深化完成日期','计划加工完成日期'],
 planEnd:['计划完成','计划完成日期','计划结束','计划竣工','计划安装完成日期','计划安装完成','要求到场日期','计划加工完成日期','计划深化完成日期'],
 actStart:['实际开始','实际开始日期','实际开工'],
 actEnd:['实际完成','实际完成日期','实际结束','实际竣工','实际安装完成日期','实际安装完成','实际深化完成日期'],
 progress:['完成率','完成率%','完成百分比','进度%','进度'],
 owner:['责任人','负责人','填报人'],
 note:['备注','说明']
};
function norm(s){return String(s||'').replace(/[\s%％()（）]/g,'').toLowerCase();}
function importRows(lines){
  var head=lines[0].map(norm),idx={};
  Object.keys(COLMAP).forEach(function(f){idx[f]=-1;COLMAP[f].forEach(function(alias){if(idx[f]<0){var j=head.indexOf(norm(alias));if(j>=0)idx[f]=j;}});});
  if(idx.name<0)idx.name=0;
  var out=[];
  for(var i=1;i<lines.length;i++){
    var r=lines[i],o={id:uid()};
    Object.keys(COLMAP).forEach(function(f){var v=idx[f]>=0?String(r[idx[f]]||'').trim():'';
      if((f==='planStart'||f==='planEnd'||f==='actStart'||f==='actEnd')&&v){var d=parseD(v.replace(/\//g,'-'));v=d?iso(d):'';}
      o[f]=v;});
    if(!o.stage)o.stage='其他';
    if(o.progress&&/已安装|已完成|已安装完成/.test(o.progress))o.progress='100';
    else if(o.progress&&/安装中|加工中|深化中/.test(o.progress))o.progress='50';
    o.progress=String(Number(o.progress)||0);
    if(!o.name)continue;
    if(!o.planStart&&o.planEnd){var pe=parseD(o.planEnd);if(pe)o.planStart=iso(addDays(pe,-14));}
    out.push(o);
  }
  return out;
}

function updateSched(t,quiet){
  var p=proj();if(!p)return;var row=null;scheduleOf(p).forEach(function(r){if(r.id===t.dataset.id)row=r;});if(!row)return;
  var f=t.dataset.sf;
  if(f==='building'){var parts=String(t.value).split('/');row.building=parts[0].trim();row.floor=(parts[1]||'').trim();}
  else row[f]=t.value;
  save();
  var box=document.getElementById('gantt-box');if(box)box.innerHTML=ganttSVG();
  var badge=document.querySelector('#gantt-card .gantt-tools .mini');
  if(badge){var late=0;scheduleOf(p).forEach(function(r){var a=parseD(r.actEnd),b=parseD(r.planEnd);if(a&&b&&a>b)late++;});badge.textContent='共 '+scheduleOf(p).length+' 项任务 ｜ 滞后 '+late+' 项 ｜ 计划与实际日期随改随动';}
}
function updateEdit(t){
  DB.internal.forEach(function(r){if(r.id===t.dataset.id)r[t.dataset.field]=t.value;});
  save();
}
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var d={};new FormData(f).forEach(function(v,k){d[k]=String(v).trim();});
  var kind=f.dataset.form;
  if(kind==='internal-add'){
    if(!d.title)return toast('请填写事项');
    DB.internal.push({id:uid(),cat:d.cat,date:d.date,title:d.title,qty:Number(d.qty)||1,note:d.note||''});save();render();toast('已登记');return;
  }
  if(kind==='project-add'){
    if(!d.name||!d.scale)return toast('请填写项目名称与项目体量');
    var np={id:uid(),name:d.name,scale:d.scale,system:d.system||'',duration:d.duration||'',note:d.note||'',created:today(),boards:{},schedule:[]};
    BOARDS.forEach(function(b){if(b.sp!=='schedule')np.boards[b.k]=[];});
    DB.projects.push(np);save();S.pid=np.id;S.board=null;S.view='project';window.scrollTo(0,0);render();toast('项目工作台已建立');return;
  }
  if(kind==='project-edit'){
    var p=proj();if(!p)return;p.name=d.name;p.scale=d.scale;p.system=d.system;p.duration=d.duration;p.note=d.note;save();closeModal();render();toast('项目信息已更新');return;
  }
  if(kind==='board-add'){
    var p2=proj();if(!p2)return;if(!d.title)return toast('请填写事项');
    var o={id:uid(),date:d.date,title:d.title,note:d.note||'',status:d.status||''};
    if(d.board==='benefit'){o.type=d.type;o.amount=Number(d.amount)||0;o.qty=1;}else o.qty=Number(d.qty)||1;
    boardData(p2,d.board).push(o);save();render();toast('已登记');return;
  }
  if(kind==='sched-add'){
    var p3=proj();if(!p3)return;if(!d.name)return toast('请填写任务名称');
    scheduleOf(p3).push({id:uid(),name:d.name,building:d.building||'',floor:'',stage:d.stage||'其他',planStart:d.planStart||'',planEnd:d.planEnd||'',actStart:'',actEnd:'',progress:'0',owner:d.owner||'',note:''});
    save();render();toast('任务已新增，甘特图已更新');return;
  }
});
