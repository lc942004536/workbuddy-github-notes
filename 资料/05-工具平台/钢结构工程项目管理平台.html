<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢结构工程项目管理平台</title>
<style>
:root{
  --ink:#0f2137; --ink2:#33475f; --muted:#7b8ca1; --faint:#a3b1c2;
  --nav:#0d2540; --nav2:#16385c; --navtxt:#a9c0d8;
  --brand:#1a5fb4; --brand2:#2b74cf; --brandl:#e9f1fb; --brandb:#c9dcf3;
  --bg:#f2f5f9; --card:#fff; --line:#dde5ee; --line2:#eef2f7;
  --ok:#0f8a5f; --okl:#e6f5ef; --warn:#b9760f; --warnl:#fdf3e2;
  --bad:#c0392b; --badl:#fbeceb; --accent:#d97706;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
a{color:var(--brand2);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c6d1de;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.shell{display:flex;height:100vh;overflow:hidden}

/* ===== 左侧主导航 ===== */
.rail{width:210px;flex:none;background:var(--nav);display:flex;flex-direction:column;color:var(--navtxt)}
.rail .brand{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.rail .brand .mk{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2b74cf,#1a5fb4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex:none}
.rail .brand b{color:#fff;font-size:12.5px;display:block;line-height:1.45;letter-spacing:0}
.rail .brand span{font-size:8.5px;color:#6f8dae;letter-spacing:.6px;display:block;margin-top:3px}
.rail .grp{padding:14px 16px 5px;font-size:10px;color:#5f7c9c;letter-spacing:1.4px}
.rail .nav{padding:0 8px}
.rail .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;color:var(--navtxt);font-size:13px;margin-bottom:2px;cursor:pointer;transition:.14s}
.rail .nav a:hover{background:rgba(255,255,255,.07);color:#fff;text-decoration:none}
.rail .nav a.on{background:var(--brand);color:#fff;font-weight:500}
.rail .nav a .ic{width:16px;text-align:center;font-size:13px;opacity:.92}
.rail .nav a .bdg{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center}
.rail .nav a.on .bdg{background:rgba(255,255,255,.28)}
.rail .bottom{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#65839f;line-height:1.8}

/* ===== 右侧主体 ===== */
.body{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.hdr{height:54px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20}
.pswitch{display:flex;flex-direction:column;justify-content:center;gap:0;border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:#fafcfe;min-width:250px;max-width:330px;cursor:pointer;height:38px}
.pswitch:hover{border-color:var(--brandb)}
.pswitch .pl{font-size:9px;color:var(--muted);line-height:1.3}
.pswitch .pn{font-size:12.5px;font-weight:600;display:block;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pswitch select{border:0;background:transparent;outline:none;font-size:12.5px;font-weight:600;padding:0;max-width:300px;cursor:pointer;line-height:1.45}
.hdr .grow{flex:1}
.hdr .hitem{font-size:12px;color:var(--muted);white-space:nowrap}
.hdr .dot{width:26px;height:26px;border-radius:50%;background:var(--brandl);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border:1px solid var(--brandb)}

.tabbar{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:2px;overflow:auto}
.tabbar button{border:0;background:none;padding:11px 14px;font-size:13px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.14s}
.tabbar button:hover{color:var(--brand)}
.tabbar button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

.main{flex:1;overflow:auto;padding:20px 22px 70px}
.page{max-width:1560px;margin:0 auto}

/* ===== 通用 ===== */
h1{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
h2{font-size:15.5px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 10px}
.lead{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb b{color:var(--ink)}
.sec{margin-bottom:16px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-hd h2,.sec-hd h3{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 16px}
.card+.card{margin-top:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1360px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:820px){.g6,.g4,.g2{grid-template-columns:1fr}.rail{width:56px}.rail .brand span,.rail .grp,.rail .nav a span:not(.ic),.rail .bottom,.rail .brand b{display:none}.rail .nav a{justify-content:center}.main{padding:14px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap;font-size:12.5px;transition:.14s}
.btn:hover{background:var(--brand2);border-color:var(--brand2)}
.btn.ghost{background:#fff;color:var(--brand);border-color:var(--brandb)}
.btn.ghost:hover{background:var(--brandl)}
.btn.gray{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn.gray:hover{background:#f7f9fc}
.btn.danger{background:#fff;color:var(--bad);border-color:#ecc9c6}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:5px}
.btn.link{border:0;background:none;color:var(--brand2);padding:1px 3px;font-size:12px}
.btn.link:hover{text-decoration:underline;background:none}
.btn.link.red{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mini{font-size:11.5px;color:var(--faint);line-height:1.7}
.hint{font-size:11.5px;color:var(--muted)}
.divider{height:1px;background:var(--line2);margin:12px 0}
.right{text-align:right}

label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
label.f b{font-weight:500;color:var(--ink2)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 9px;outline:none;transition:.14s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(43,116,207,.1)}
textarea{resize:vertical;min-height:64px}
input[type=file]{padding:5px}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.fgrid .w2{grid-column:span 2}

/* KPI */
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 14px;position:relative;overflow:hidden}
.kpi .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .v{font-size:22px;font-weight:650;letter-spacing:.3px;margin-top:5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11.5px;font-weight:400;color:var(--muted);margin-left:3px}
.kpi .d{font-size:11px;color:var(--faint);margin-top:3px}
.kpi:after{content:"";position:absolute;right:-14px;top:-14px;width:44px;height:44px;border-radius:50%;background:var(--brandl);opacity:.6}
.kpi.b:after{background:var(--badl)} .kpi.g:after{background:var(--okl)} .kpi.o:after{background:var(--warnl)}
.kpi.b .v{color:var(--bad)} .kpi.g .v{color:var(--ok)} .kpi.o .v{color:var(--warn)}

/* 表格 */
.twrap{overflow:auto;border:1px solid var(--line);border-radius:7px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
th{background:#f7f9fc;color:var(--muted);font-weight:600;font-size:11.5px;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
tbody tr:hover{background:#f9fbfe}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:150px;max-width:300px}
.empty{text-align:center;color:var(--faint);padding:26px 12px;font-size:12.5px}
.empty b{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}

.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;border:1px solid var(--line);background:#f7f9fc;color:var(--muted);line-height:1.6}
.tag.blue{background:var(--brandl);border-color:var(--brandb);color:var(--brand)}
.tag.ok{background:var(--okl);border-color:#c3e8da;color:var(--ok)}
.tag.warn{background:var(--warnl);border-color:#f0dcb8;color:var(--warn)}
.tag.bad{background:var(--badl);border-color:#efcbc7;color:var(--bad)}
.tag.gray{background:#f1f4f8;border-color:#e3e9f1}

/* 进度条 */
.pbar{height:6px;background:#e9eef5;border-radius:4px;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.pbar.ok i{background:var(--ok)} .pbar.bad i{background:var(--bad)} .pbar.warn i{background:var(--warn)}

/* 分段按钮 */
.seg{display:inline-flex;background:#eef2f7;border-radius:6px;padding:2px;gap:1px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:11.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* 文件夹卡片 */
.folder{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;transition:.16s;position:relative}
.folder:hover{border-color:var(--brandb);box-shadow:0 6px 18px rgba(20,50,90,.08);transform:translateY(-1px)}
.folder .fi{width:30px;height:30px;border-radius:6px;background:var(--brandl);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:8px}
.folder .fn{font-size:13px;font-weight:600}
.folder .fv{font-size:20px;font-weight:650;color:var(--brand);margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.folder .fv small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.folder .fd{font-size:10.5px;color:var(--faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder.acc .fi{background:var(--warnl);color:var(--accent)} .folder.acc .fv{color:var(--accent)}

/* 横向条形 */
.hrow{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12px}
.hrow .hl{width:104px;flex:none;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .htrack{flex:1;height:8px;background:#eef2f7;border-radius:4px;overflow:hidden}
.hrow .htrack i{display:block;height:100%;border-radius:4px;background:var(--brand2)}
.hrow .hv{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.hrow .hu{width:22px;color:var(--faint);font-size:10.5px}

/* 预警 */
.alert{display:flex;gap:9px;padding:9px 11px;border-radius:6px;border:1px solid;font-size:12.5px;margin-bottom:7px;align-items:flex-start}
.alert .ai{font-size:13px;line-height:1.4}
.alert.red{background:#fdf4f3;border-color:#f0d2ce;color:#8f2c22}
.alert.amber{background:#fdf9f0;border-color:#f0e2c4;color:#8a5b0c}
.alert.blue{background:#f3f8fe;border-color:#d5e4f7;color:#1b4d8a}
.alert b{font-weight:600}

/* 看板 */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kcol{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:9px;min-height:130px}
.kcol .kh{font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.kcol .kh span{background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 6px;font-size:10px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px;margin-bottom:7px;font-size:12px;cursor:pointer;transition:.14s}
.kcard:hover{border-color:var(--brandb);box-shadow:0 3px 10px rgba(20,50,90,.07)}
.kcard .kt{font-weight:500;line-height:1.5;margin-bottom:5px;white-space:normal}
.kcard .km{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);gap:6px}
.kcard .km .lv{font-weight:600}

/* 里程碑 */
.mile{position:relative;padding-left:18px;padding-bottom:14px;border-left:2px solid #e4eaf2}
.mile:last-child{border-left-color:transparent;padding-bottom:0}
.mile:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brandb)}
.mile.done:before{background:var(--ok);border-color:var(--ok)}
.mile.late:before{background:var(--bad);border-color:var(--bad)}
.mile .mt{font-size:12.5px;font-weight:500}
.mile .md{font-size:11px;color:var(--faint)}

/* 路径条 */
.pathbar{display:flex;align-items:center;gap:8px;background:#f7f9fc;border:1px dashed #ccd9e8;border-radius:6px;padding:7px 10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-bottom:12px}
.pathbar code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--brand);font-family:Consolas,Monaco,monospace;font-size:11.5px}

/* 引用卡 */
.refcard{border-left:3px solid var(--brand2)}
.refcard .rt{font-size:13px;font-weight:600;margin-bottom:5px}
.refcard .rd{font-size:12px;color:var(--muted);line-height:1.75}
.refcard .rl{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}

/* 说明块 */
.note{background:#f7f9fc;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.85}
.note b{color:var(--ink)}
.note.orange{background:#fdf8f1;border-color:#f1e0c7}
ul.tips{margin:0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.95}
ul.tips b{color:var(--ink)}

/* 甘特 */
.gshell{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.gtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 11px;border-bottom:1px solid var(--line);background:#fbfcfe}
.gscroll{overflow:auto;max-height:540px}
.gscroll svg{display:block}
.glegend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:8px 11px;border-top:1px solid var(--line);background:#fbfcfe}
.glegend i{display:inline-block;width:13px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.stbl input,.stbl select{border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:4px;min-width:82px;font-size:12px}
.stbl input:hover,.stbl select:hover{border-color:var(--line);background:#fff}
.stbl input:focus,.stbl select:focus{border-color:var(--brand2);background:#fff}
.stbl td{padding:3px 5px} .stbl th{padding:7px 7px}
.stbl input[type=date]{min-width:128px}
.stbl input[type=number]{min-width:58px;text-align:right}

/* 弹窗 & toast */
.mbg{position:fixed;inset:0;background:rgba(10,22,40,.48);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.mbox{background:#fff;border-radius:9px;width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.mbox .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.mbox .mb{padding:18px}
.mbox .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#0f2137;color:#fff;padding:9px 16px;border-radius:7px;font-size:12.5px;z-index:200;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 10px 30px rgba(0,0,0,.24)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 打印 */
@media print{
  body{overflow:visible;background:#fff}
  .rail,.hdr,.tabbar,.no-print{display:none !important}
  .body,.main{overflow:visible;height:auto;padding:0}
  .page{max-width:none}
  .card{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="mk">钢</div><div><b>钢结构工程<br>项目管理平台</b><span>STEEL PM PLATFORM</span></div></div>
    <div id="rail"></div>
    <div class="bottom">数据存于本机浏览器<br>请定期导出备份</div>
  </aside>
  <div class="body">
    <header class="hdr">
      <div class="pswitch" id="pswitch"></div>
      <div class="grow"></div>
      <div class="hitem" id="hdate"></div>
      <div class="hitem" id="hsave" style="color:var(--ok)">已保存</div>
      <button class="btn ghost sm no-print" data-act="backup">导出备份</button>
      <div class="dot">李</div>
    </header>
    <div class="tabbar no-print" id="tabbar" style="display:none"></div>
    <main class="main"><div class="page" id="view"></div></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
/* ========== 常量 ========== */
var KEY='steel_pm_platform_v2';

 {k:'shenhua', n:'深化设计审核', u:'条', i:'▤', d:'深化图、节点、模型审核'},

 {k:'zhaocai', n:'招采审核',     u:'条', i:'▣', d:'招标文件、清单、技术条款'},
 {k:'yingxiao',n:'配合营销',     u:'条', i:'◇', d:'投标配合、技术交流、答疑'},
 {k:'zhuanti', n:'专题论证会',   u:'次', i:'◎', d:'专家论证、专题会、评审'},
 {k:'zhuchang',n:'驻场配合',     u:'天', i:'⌂', d:'现场驻场、厂内监造'},
 {k:'qita',    n:'其他',         u:'条', i:'⋯', d:'未归类事项'}
];
var TABS=[
 {k:'portal',  n:'项目门户'},
 {k:'schedule',n:'进度管理'},
 {k:'quality', n:'质量管理'},
 {k:'zhaocai', n:'招采配合'},
 {k:'shenhua', n:'深化设计'},
 {k:'benefit', n:'创效管理'}
];
var STAGES=['深化设计','原材料到厂','加工制作','运输进场','安装吊装','焊接高栓','涂装验收','其他'];
var QLEVEL=['一般','较大','严重'];
var QSTATUS=['待整改','整改中','待复查','已闭环'];

/* ========== 数据层 ========== */
function blank(){return {v:2,internal:[],projects:[]};}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.internal&&d.projects)return d;}catch(e){}return blank();}
DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));var el=document.getElementById('hsave');if(el){el.textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}}catch(e){toast('保存失败：'+e.message);}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function attr(s){return esc(s).replace(/\n/g,' ');}
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2000);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function money(n){return (Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(n){return (Number(n)||0).toLocaleString('zh-CN');}

/* ========== 日期 ========== */
function parseD(s){if(!s)return null;var d=new Date(String(s).slice(0,10)+'T00:00:00');return isNaN(d.getTime())?null:d;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function diffDays(a,b){return Math.round((b-a)/86400000);}
function weekStart(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);var w=x.getDay()||7;x.setDate(x.getDate()-w+1);return x;}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var wd=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-wd);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return {y:t.getUTCFullYear(),w:Math.ceil(((t-y0)/86400000+1)/7)};}
var PN={week:'周',month:'月',quarter:'季度',half:'半年',year:'年'};
function periodInfo(ds,type){
  var d=parseD(ds);if(!d)return null;var y=d.getFullYear(),m=d.getMonth()+1;
  if(type==='week'){var w=isoWeek(d),s=weekStart(d),e=addDays(s,6);return {key:w.y+'-W'+String(w.w).padStart(2,'0'),label:w.y+'年第'+w.w+'周',sub:iso(s)+' ~ '+iso(e),order:iso(s)};}
  if(type==='month')return {key:y+'-'+String(m).padStart(2,'0'),label:y+'年'+m+'月',sub:'',order:y+'-'+String(m).padStart(2,'0')};
  if(type==='quarter'){var q=Math.ceil(m/3);return {key:y+'-Q'+q,label:y+'年第'+q+'季度',sub:(q*3-2)+'月 ~ '+q*3+'月',order:y+'-Q'+q};}
  if(type==='half'){var h=m<=6?1:2;return {key:y+'-H'+h,label:y+'年'+(h===1?'上':'下')+'半年',sub:h===1?'1月 ~ 6月':'7月 ~ 12月',order:y+'-H'+h};}
  return {key:String(y),label:y+'年度',sub:'全年',order:String(y)};
}
function curPeriod(type){var p=periodInfo(today(),type);return p?p.key:null;}

/* ========== 业务取数 ========== */
function catOf(k){for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return CATS[i];return CATS[6];}
function proj(){for(var i=0;i<DB.projects.length;i++)if(DB.projects[i].id===S.pid)return DB.projects[i];return null;}
function P(k){var p=proj();if(!p)return [];if(!p[k])p[k]=[];return p[k];}
function sched(){return P('schedule');}
function overallProgress(p){var t=p.schedule||[],w=0,s=0;t.forEach(function(r){var ww=Number(r.weight)||1;w+=ww;s+=ww*(Number(r.progress)||0);});return w?Math.round(s/w):0;}
function lateTasks(p){return (p.schedule||[]).filter(function(r){var a=parseD(r.actEnd),b=parseD(r.planEnd);return (a&&b&&a>b)||(!a&&b&&b<new Date());});}
function openQuality(p){return (p.quality||[]).filter(function(r){return r.status!=='已闭环';});}
function benefitSum(p){var s=0;(p.benefit||[]).forEach(function(r){s+=Number(r.amount)||0;});return s;}
function summarize(type){
  var map={};
  DB.internal.forEach(function(r){
    var p=periodInfo(r.date,type);if(!p)return;
    if(!map[p.key])map[p.key]={key:p.key,label:p.label,sub:p.sub,order:p.order,vals:{},total:0};
    var q=Number(r.qty)||0;
    map[p.key].vals[r.cat]=(map[p.key].vals[r.cat]||0)+q;
    map[p.key].total+=q;
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.order.localeCompare(b.order);});
}
function summaryText(p){
  return p.label+(p.sub?'（'+p.sub+'）':'')+' 内业工作汇总：'+CATS.map(function(c){return c.n+' '+(p.vals[c.k]||0)+' '+c.u;}).join('、')+'；合计 '+p.total+'。';
}
function recentWeeks(n){
  var arr=[],ws=weekStart(new Date());
  for(var i=n-1;i>=0;i--){var s=addDays(ws,-7*i),e=addDays(s,6);arr.push({key:isoWeek(s).y+'-W'+String(isoWeek(s).w).padStart(2,'0'),label:(s.getMonth()+1)+'/'+s.getDate(),sub:iso(s)+'~'+iso(e),vals:{},total:0,s:s,e:e});}
  DB.internal.forEach(function(r){
    var d=parseD(r.date);if(!d)return;
    arr.forEach(function(w){if(d>=w.s&&d<=w.e){var q=Number(r.qty)||0;w.vals[r.cat]=(w.vals[r.cat]||0)+q;w.total+=q;}});
  });
  return arr;
}

/* ========== 组件 ========== */
function kpi(k,v,d,cls){return '<div class="kpi '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+(d||'')+'</div></div>';}
function empty(t,s){return '<div class="empty"><b>'+esc(t)+'</b>'+esc(s||'')+'</div>';}
function tag(t,cls){return '<span class="tag '+(cls||'')+'">'+esc(t)+'</span>';}
function pbar(v,cls){v=Math.max(0,Math.min(100,Number(v)||0));return '<div class="pbar '+(cls||'')+'" title="'+v+'%"><i style="width:'+v+'%"></i></div>';}
function copyBtn(txt,label){return '<button class="btn gray sm" data-act="copy" data-txt="'+attr(txt)+'">'+(label||'复制路径')+'</button>';}
function pathbar(path,extra){return '<div class="pathbar"><span>📁 磁盘文件夹</span><code>'+esc(path)+'</code>'+copyBtn(path)+(extra||'')+'</div>';}
function refCard(key){
  var r=REFS[key];
  return '<div class="card refcard"><div class="rt">🔗 '+esc(r.n)+'</div><div class="rd">'+esc(r.d)+'</div><div class="rl">'+
    '<a class="btn ghost sm" href="'+r.lib+'" target="_blank" rel="noopener">资料库文档 ↗</a>'+
    '<a class="btn ghost sm" href="'+r.app+'" target="_blank" rel="noopener">在线应用 ↗</a></div></div>';
}
function tbl(cols,rows,emp){
  if(!rows.length)return '<div class="twrap">'+empty('暂无记录',emp||'填写上方表单后自动生成')+'</div>';
  return '<div class="twrap"><table><thead><tr>'+cols.map(function(c){return '<th class="'+(c.num?'num':'')+'">'+c.t+'</th>';}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function hbars(items,unit){
  if(!items.length)return empty('暂无数据');
  var max=Math.max.apply(null,items.map(function(x){return x.v||0;}).concat([1]));
  return items.map(function(x){
    return '<div class="hrow"><span class="hl" title="'+attr(x.n)+'">'+esc(x.n)+'</span><div class="htrack"><i style="width:'+Math.round((x.v||0)/max*100)+'%;background:'+(x.c||'var(--brand2)')+'"></i></div><span class="hv">'+num(x.v)+'</span><span class="hu">'+esc(unit||'')+'</span></div>';
  }).join('');
}
function vbar(labels,series,h){
  h=h||168;var W=660,H=h,padL=34,padB=22,padT=10,n=labels.length||1;
  var max=1;series.forEach(function(s){s.data.forEach(function(v){if(v>max)max=v;});});
  var step=(W-padL-10)/n,bw=Math.min(20,(step-6)/series.length);
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" font-family="inherit">';
  for(var g=0;g<=3;g++){var y=padT+(H-padT-padB)*g/3;s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#eef2f7"/><text x="'+(padL-5)+'" y="'+(y+3)+'" font-size="9" fill="#a3b1c2" text-anchor="end">'+Math.round(max*(1-g/3))+'</text>';}
  labels.forEach(function(lb,i){
    var x0=padL+i*step+step/2-(series.length*bw)/2;
    series.forEach(function(sr,j){
      var v=sr.data[i]||0,hh=(H-padT-padB)*(v/max);
      s+='<rect x="'+(x0+j*bw)+'" y="'+(H-padB-hh)+'" width="'+(bw-2)+'" height="'+hh+'" rx="2" fill="'+sr.c+'"><title>'+esc(sr.n)+' '+esc(lb)+'：'+num(v)+'</title></rect>';
    });
    if(n<=14)s+='<text x="'+(padL+i*step+step/2)+'" y="'+(H-6)+'" font-size="9.5" fill="#8fa1b5" text-anchor="middle">'+esc(lb)+'</text>';
  });
  s+='</svg>';
  return s;
}

function viewDash(){

  var h='<h1>驾驶舱</h1><p class="lead">'+esc(wk.label)+' · '+esc(wk.sub)+' ｜ 内业工作与在管项目运行状态</p>';

    kpi('专题会 / 驻场',(v.zhuanti||0)+' / '+(v.zhuchang||0),'次 / 天','o')+
    kpi('在管项目',DB.projects.length,'个', 'g')+
    kpi('进度滞后项',totLate,totLate?'需关注':'运行正常',totLate?'b':'')+
    kpi('质量未闭环',totQ,totQ?'待整改 / 复查':'全部闭环',totQ?'b':'')+'</div>';

  var weeks=recentWeeks(8);
  h+='<div class="grid g2 sec"><div class="card"><div class="sec-hd"><h3>内业工作量趋势（近 8 周）</h3><span class="mini">按数量累计</span></div>'+
     vbar(weeks.map(function(w){return w.label;}),[{n:'内业工作量',c:'#2b74cf',data:weeks.map(function(w){return w.total;})}])+'</div>';
  h+='<div class="card"><div class="sec-hd"><h3>本周内业结构</h3><span class="mini">不区分项目</span></div>'+
     hbars(CATS.map(function(c){return {n:c.n,v:v[c.k]||0};}),'')+'</div></div>';

  h+='<div class="card sec"><div class="sec-hd"><h2>项目运行状态</h2><button class="btn ghost sm no-print" data-act="nav" data-v="projects">项目管理 →</button></div>';
  if(!DB.projects.length)h+=empty('还没有项目','在「项目管理」新建项目，按项目单独建立文件夹');
  else{
    h+='<div class="twrap"><table><thead><tr><th>项目名称</th><th>项目体量</th><th style="width:150px">总体进度</th><th class="num">滞后项</th><th class="num">质量未闭环</th><th class="num">创效额(万元)</th><th></th></tr></thead><tbody>';
    DB.projects.forEach(function(p){
      var op=overallProgress(p),lt=lateTasks(p).length,oq=openQuality(p).length;
      h+='<tr><td><b>'+esc(p.name)+'</b><div class="mini">'+esc(p.duration||'')+'</div></td><td class="wrap mini">'+esc(p.scale||'—')+'</td>'+
        '<td><div class="row" style="gap:7px">'+pbar(op,op>=80?'ok':op>=40?'':'warn')+'<span class="mini" style="width:30px">'+op+'%</span></div></td>'+
        '<td class="num">'+(lt?'<span class="tag bad">'+lt+'</span>':'0')+'</td><td class="num">'+(oq?'<span class="tag warn">'+oq+'</span>':'0')+'</td>'+
        '<td class="num"><b>'+money(benefitSum(p))+'</b></td><td class="right"><button class="btn link" data-act="openproj" data-id="'+p.id+'">进入 →</button></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  /* 预警中心 */
  var alerts=[];
  DB.projects.forEach(function(p){
    lateTasks(p).forEach(function(t){alerts.push({t:'red',p:p.name,m:'进度滞后：'+t.name+'（计划完成 '+(t.planEnd||'—')+(t.actEnd?'，实际 '+t.actEnd:'，尚未完成')+'）'});});
    openQuality(p).forEach(function(q){alerts.push({t:'amber',p:p.name,m:'质量未闭环：'+q.title+'（'+(q.type||'未分类')+' / '+q.status+'）'});});
    (p.milestones||[]).forEach(function(m){var d=parseD(m.date);if(!m.done&&d&&d<new Date())alerts.push({t:'amber',p:p.name,m:'里程碑逾期：'+m.name+'（'+(m.date||'')+'）'});});
  });
  h+='<div class="card"><div class="sec-hd"><h2>预警中心</h2><span class="mini">'+alerts.length+' 条待处理</span></div>';
  if(!alerts.length)h+='<div class="alert blue"><span class="ai">✓</span><div>当前无进度滞后、质量未闭环或里程碑逾期事项。</div></div>';
  else alerts.slice(0,10).forEach(function(a){h+='<div class="alert '+a.t+'"><span class="ai">'+(a.t==='red'?'!':'△')+'</span><div><b>'+esc(a.p)+'</b> · '+esc(a.m)+'</div></div>';});
  h+='</div>';
  return h;
}

/* ========== S 曲线 ========== */
function sCurveSVG(p){
  var t=(p.schedule||[]).filter(function(r){return parseD(r.planStart)&&parseD(r.planEnd);});
  if(!t.length)return empty('暂无进度任务','在进度管理中录入计划后自动生成');
  var W=620,H=200,padL=34,padR=10,padT=12,padB=24;
  var min=null,max=null;
  t.forEach(function(r){var a=parseD(r.planStart),b=parseD(r.planEnd);if(!min||a<min)min=a;if(!max||b>max)max=b;});
  min=weekStart(min);max=addDays(max,3);
  var days=Math.max(1,diffDays(min,max));
  var totalW=t.reduce(function(s,r){return s+(Number(r.weight)||1);},0)||1;
  var todayD=new Date();todayD=new Date(todayD.getFullYear(),todayD.getMonth(),todayD.getDate());
  function P(d){return padL+(W-padL-padR)*diffDays(min,d)/days;}
  function Y(v){return padT+(H-padT-padB)*(1-v/100);}
  var pts=[],apts=[],d=new Date(min);
  while(d<=max){
    var pv=0;
    t.forEach(function(r){var a=parseD(r.planStart),b=parseD(r.planEnd),w=Number(r.weight)||1;
      var k=Math.max(0,Math.min(1,diffDays(a,d)/Math.max(1,diffDays(a,b))));pv+=w*k;});
    pv=pv/totalW*100;
    pts.push([d.getTime(),pv]);
    if(d<=todayD){
      var av=0;
      t.forEach(function(r){var a=parseD(r.planStart),b=parseD(r.planEnd),as=parseD(r.actStart),ae=parseD(r.actEnd),w=Number(r.weight)||1;
        var pr=Number(r.progress)||0;
        if(ae&&d>=ae)av+=w;
        else if(as&&d>=as){var kk=Math.min(1,diffDays(as,d)/Math.max(1,diffDays(as,todayD)));av+=w*(pr/100)*kk;}
      });
      av=av/totalW*100;apts.push([d.getTime(),av]);
    }
    d=addDays(d,7);
  }
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" font-family="inherit">';
  for(var g=0;g<=4;g++){var y=Y(g*25);s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#eef2f7"/><text x="'+(padL-4)+'" y="'+(y+3)+'" font-size="9" fill="#a3b1c2" text-anchor="end">'+(g*25)+'%</text>';}
  function path(a){return a.map(function(q,i){return (i?'L':'M')+P(new Date(q[0])).toFixed(1)+' '+Y(q[1]).toFixed(1);}).join(' ');}
  if(pts.length>1){
    s+='<path d="'+path(pts)+' L'+P(new Date(pts[pts.length-1][0]))+' '+Y(0)+' L'+P(new Date(pts[0][0]))+' '+Y(0)+' Z" fill="#e9f1fb" opacity=".7"/>';
    s+='<path d="'+path(pts)+'" fill="none" stroke="#8fb8e6" stroke-width="2" stroke-dasharray="4 3"/>';
  }
  if(apts.length>1)s+='<path d="'+path(apts)+'" fill="none" stroke="#1a5fb4" stroke-width="2.4"/>';
  var ticks=4;
  for(var i=0;i<=ticks;i++){var dd=addDays(min,Math.round(days*i/ticks));s+='<text x="'+P(dd)+'" y="'+(H-7)+'" font-size="9" fill="#8fa1b5" text-anchor="middle">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</text>';}
  if(todayD>=min&&todayD<=max){var tx=P(todayD);s+='<line x1="'+tx+'" y1="'+padT+'" x2="'+tx+'" y2="'+(H-padB)+'" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>';}
  s+='<g><rect x="'+(W-118)+'" y="0" width="10" height="3" fill="#8fb8e6"/><text x="'+(W-104)+'" y="4" font-size="9" fill="#7b8ca1">计划累计</text>'+
     '<rect x="'+(W-58)+'" y="0" width="10" height="3" fill="#1a5fb4"/><text x="'+(W-44)+'" y="4" font-size="9" fill="#7b8ca1">实际累计</text></g>';
  s+='</svg>';
  return s;
}

/* ========== 甘特图 ========== */
function ganttSVG(limit,compact){
  var p=proj();if(!p)return '';
  var rows=sched();
  if(limit&&limit>0)rows=rows.slice(0,limit);
  var miles=(p.milestones||[]).slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  if(!rows.length&&!miles.length)return empty('暂无进度任务','在进度计划表新增任务或导入 CSV 后生成甘特图');
  var dates=[];
  rows.forEach(function(r){['planStart','planEnd','actStart','actEnd'].forEach(function(f){var d=parseD(r[f]);if(d)dates.push(d);});});
  miles.forEach(function(m){var d=parseD(m.date);if(d)dates.push(d);});
  if(!dates.length)return empty('尚未填写日期','请在进度计划表中填写计划开始 / 计划完成');
  var min=new Date(Math.min.apply(null,dates)),max=new Date(Math.max.apply(null,dates));
  min=weekStart(min);max=addDays(max,7);
  var total=Math.max(14,diffDays(min,max));max=addDays(min,total);
  var dayW=compact?Math.max(7,Math.round(560/Math.max(1,total))):S.dayW;
  var left=compact?196:262,top=54,rowH=compact?28:34;
  var lineCount=rows.length+(miles.length?1:0);
  var w=left+total*dayW+26,h=top+lineCount*rowH+30;
  function X(d){return left+diffDays(min,parseD(d))*dayW;}
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" font-family="Microsoft YaHei,PingFang SC,sans-serif" id="gantt-svg">';
  s+='<rect width="'+w+'" height="'+h+'" fill="#fff"/><rect x="0" y="0" width="'+w+'" height="'+top+'" fill="#f7f9fc"/>';
  s+='<line x1="0" y1="'+top+'" x2="'+w+'" y2="'+top+'" stroke="#dde5ee"/>';
  var months=[],cur=new Date(min.getFullYear(),min.getMonth(),1);
  while(cur<=max){
    var ms=cur<min?min:new Date(cur),nx=new Date(cur.getFullYear(),cur.getMonth()+1,1),me=nx>max?max:addDays(nx,-1);
    months.push({s:ms,e:me,label:cur.getFullYear()+'年'+(cur.getMonth()+1)+'月'});cur=nx;
  }
  months.forEach(function(m){
    var x1=X(iso(m.s)),x2=X(iso(m.e))+dayW;
    s+='<rect x="'+x1+'" y="0" width="'+(x2-x1)+'" height="24" fill="#eaf2fc" stroke="#dae7f6"/>';
    s+='<text x="'+(x1+7)+'" y="16" font-size="10.5" fill="#3f5b7d">'+esc(m.label)+'</text>';
  });
  var step=total>150?14:(total>70?7:7);
  for(var i=0;i<=total;i+=step){
    var d2=addDays(min,i),x=left+i*dayW;
    s+='<line x1="'+x+'" y1="24" x2="'+x+'" y2="'+h+'" stroke="#f0f4f9"/>';
    if(dayW>=7)s+='<text x="'+(x+2)+'" y="41" font-size="9" fill="#93a4b8">'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0')+'</text>';
  }
  s+='<rect x="0" y="0" width="'+left+'" height="'+top+'" fill="#f7f9fc"/>';
  s+='<text x="10" y="33" font-size="11" fill="#7b8ca1" font-weight="600">WBS / 任务 · 阶段</text>';
  s+='<line x1="'+left+'" y1="0" x2="'+left+'" y2="'+h+'" stroke="#d9e2ec"/>';
  var td=new Date();td=new Date(td.getFullYear(),td.getMonth(),td.getDate());
  if(td>=min&&td<=max){
    var tx=X(iso(td));
    s+='<line x1="'+tx+'" y1="24" x2="'+tx+'" y2="'+(h-22)+'" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>';
    s+='<text x="'+(tx+3)+'" y="'+(top-8)+'" font-size="9.5" fill="#c0392b">今日</text>';
  }
  var y=top;
  if(miles.length){
    s+='<rect x="0" y="'+y+'" width="'+w+'" height="'+rowH+'" fill="#fbfdf9"/>';
    s+='<text x="10" y="'+(y+13)+'" font-size="11" fill="#0f8a5f" font-weight="600">◆ 里程碑</text>';
    if(!compact)s+='<text x="10" y="'+(y+26)+'" font-size="9" fill="#a3b1c2">关键节点</text>';
    miles.forEach(function(m){
      if(!parseD(m.date))return;
      var mx=X(m.date),cy=y+rowH/2;
      s+='<path d="M'+mx+' '+(cy-6)+' L'+(mx+6)+' '+cy+' L'+mx+' '+(cy+6)+' L'+(mx-6)+' '+cy+' Z" fill="'+(m.done?'#0f8a5f':'#d97706')+'"><title>'+esc(m.name)+' '+(m.date||'')+'</title></path>';
      if(!compact)s+='<text x="'+(mx+9)+'" y="'+(cy+3.5)+'" font-size="9" fill="#5b6d82">'+esc((m.name||'').slice(0,10))+'</text>';
    });
    s+='<line x1="0" y1="'+(y+rowH)+'" x2="'+w+'" y2="'+(y+rowH)+'" stroke="#eef2f7"/>';
    y+=rowH;
  }
  rows.forEach(function(r,idx){
    if(idx%2===1)s+='<rect x="0" y="'+y+'" width="'+w+'" height="'+rowH+'" fill="#fafcff"/>';
    s+='<line x1="0" y1="'+(y+rowH)+'" x2="'+w+'" y2="'+(y+rowH)+'" stroke="#f2f5f9"/>';
    s+='<text x="10" y="'+(y+(compact?12:14))+'" font-size="9" fill="#a3b1c2">WBS '+(idx+1)+'</text>';
    s+='<text x="'+(compact?10:42)+'" y="'+(y+(compact?12:14))+'" font-size="'+(compact?10:11.5)+'" fill="#1c2b3e">'+esc((r.name||'未命名').slice(0,compact?14:20))+'</text>';
    if(!compact)s+='<text x="42" y="'+(y+27)+'" font-size="9" fill="#94a3b8">'+esc(((r.building||'')+(r.floor?' / '+r.floor:'')+' · '+(r.stage||'')).slice(0,28))+'</text>';
    var ps=parseD(r.planStart),pe=parseD(r.planEnd),as=parseD(r.actStart),ae=parseD(r.actEnd);
    var late=ae&&pe&&ae>pe;
    var bh=compact?9:11;
    if(ps&&pe&&pe>=ps){
      var x1=X(r.planStart),bw=Math.max(dayW*1.2,(diffDays(ps,pe)+1)*dayW),by=y+(compact?9:7);
      s+='<rect x="'+x1+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="2.5" fill="'+(late?'#f0c9c4':'#c5d9f1')+'"/>';
      var pr=Math.max(0,Math.min(100,Number(r.progress)||0));
      if(pr>0)s+='<rect x="'+x1+'" y="'+by+'" width="'+(bw*pr/100)+'" height="'+bh+'" rx="2.5" fill="'+(late?'#c0392b':'#1a5fb4')+'"/>';
      if(!compact&&bw>40)s+='<text x="'+(x1+4)+'" y="'+(by+8.5)+'" font-size="8.5" fill="#fff">'+pr+'%</text>';
    }
    if(as&&ae&&ae>=as){
      var ax=X(r.actStart),aw=Math.max(dayW*1.2,(diffDays(as,ae)+1)*dayW);
      s+='<rect x="'+ax+'" y="'+(y+(compact?20:22))+'" width="'+aw+'" height="'+(compact?3:4)+'" rx="1.5" fill="#e8a45e"/>';
    }
    if(late&&!compact){
      var dd=diffDays(pe,ae);
      s+='<text x="'+(X(r.planEnd)+dayW*1.2+5)+'" y="'+(y+15)+'" font-size="9" fill="#c0392b">滞后 '+dd+' 天</text>';
    }
    y+=rowH;
  });
  s+='<text x="10" y="'+(h-7)+'" font-size="9" fill="#a3b1c2">'+esc(p.name)+' · 进度甘特图 · '+today()+'</text>';
  s+='</svg>';
  return s;
}

/* ========== CSV ========== */
function download(name,text,mime){
  var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},300);
}
function csv(rows){return '\ufeff'+rows.map(function(r){return r.map(function(c){var s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\r\n');}
function parseCSV(text){
  text=text.replace(/^\ufeff/,'').trim();if(!text)return [];
  var lines=[],cur=[],val='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){val+='"';i++;}else q=false;}else val+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){cur.push(val);val='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;cur.push(val);lines.push(cur);cur=[];val='';}
    else val+=ch;}
  if(val||cur.length){cur.push(val);lines.push(cur);}
  return lines.filter(function(l){return l.some(function(c){return String(c).trim();});});
}

    var r=lines[i],o={id:uid(),wbs:String(i),weight:1};
    Object.keys(COLMAP).forEach(function(f){
      var v=idx[f]>=0?String(r[idx[f]]||'').trim():'';
      if((f==='planStart'||f==='planEnd'||f==='actStart'||f==='actEnd')&&v){var d=parseD(v.replace(/\//g,'-'));v=d?iso(d):'';}
      o[f]=v;
    });
    if(!o.stage)o.stage='其他';
    if(o.progress&&/已安装|已完成|已安装完成/.test(o.progress))o.progress='100';
    else if(o.progress&&/安装中|加工中|深化中/.test(o.progress))o.progress='50';
    o.progress=String(Number(o.progress)||0);
    if(!o.name)continue;
    if(!o.planStart&&o.planEnd){var pe=parseD(o.planEnd);if(pe)o.planStart=iso(addDays(pe,-14));}
    out.push(o);
  }
  return out;
}

function copyText(t){

}
